<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <title>Khóa học Front-end</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Khóa học Front-end</h1>
    <div class="container">
        <div class="card">
            <i class="fa-brands fa-html5 icon"></i>
            <h2>HTML5</h2>
            <p>Học cấu trúc website, thẻ HTML và xây dựng giao diện cơ bản.</p>
            <button>Chi tiết</button>
        </div>
        <div class="card">
            <i class="fa-brands fa-css3-alt icon"></i>
            <h2>CSS3</h2>
            <p>Thiết kế giao diện đẹp với màu sắc, hiệu ứng và bố cục Flexbox.</p>
            <button>Chi tiết</button>
        </div>
        <div class="card">
            <i class="fa-brands fa-js icon"></i>
            <h2>JavaScript</h2>
            <p>Thêm tính năng tương tác và xử lý sự kiện cho website.</p>
            <button>Chi tiết</button>
        </div>
    </div>
</body>
</html>
